<text x="975.0" y="347.0" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">0x40</text>
<rect x="1027.0" y="354.0" width="29.0" height="20.0" fill="url(#xc)" stroke="#b9c4cf" stroke-width="0.8"/>
<text x="423.0" y="367.0" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#67727e" text-anchor="middle" stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">return value discarded</text>
<text x="14.0" y="460.0" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#67727e" text-anchor="start">• Dotted verticals are byte boundaries inside ONE burst: the three bytes of an access are clocked back to back, 24 unbroken SCLK cycles. Between accesses the clock is parked low, which is why RD can be moved at all.</text>
<text x="14.0" y="477.0" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#67727e" text-anchor="start">• RD idles low. spi_burst_strobe() raises it a few hundred ns before the burst's first rising CLOCK edge (t1), holds it across that edge, and releases it on the SECOND rising edge — a high time of about one CLOCK period (t3).</text>
<text x="14.0" y="494.0" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#67727e" text-anchor="start">• read_word() strips the frame's 2 leading indicator bits and trailing zeros: 0x04 0x10 0x40 → 0x1041. The last 4 clocks are padding past the 20-bit frame.</text>
<rect x="20.0" y="502.0" width="22" height="11" fill="url(#xc)" stroke="#b9c4cf" stroke-width="0.8"/>
<text x="48.0" y="511.0" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#67727e" text-anchor="start">line is undriven or its value is not used</text>
</svg>